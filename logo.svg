<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" width="200" height="100">
  <!-- Left circle - blue fill with navy stroke -->
  <circle cx="50" cy="50" r="28" fill="#356391" stroke="#0F172C" stroke-width="5.5"/>

  <!-- Right circle - teal fill with navy stroke -->
  <circle cx="150" cy="50" r="28" fill="#38CFB9" stroke="#0F172C" stroke-width="5.5"/>

  <!-- Horizontal bridge bar -->
  <rect x="44" y="47" width="112" height="7" rx="1" fill="#0F172C"/>

  <!-- Bridge peak/roof - triangle -->
  <polygon points="100,24 74,47 126,47" fill="none" stroke="#0F172C" stroke-width="4" stroke-linejoin="round"/>

  <!-- Bridge support struts -->
  <line x1="87" y1="47" x2="91" y2="35" stroke="#0F172C" stroke-width="3" stroke-linecap="round"/>
  <line x1="113" y1="47" x2="109" y2="35" stroke="#0F172C" stroke-width="3" stroke-linecap="round"/>
</svg>
