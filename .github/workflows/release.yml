name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # Required for npm trusted publishing via OIDC. GitHub mints a short-lived
  # OIDC token that npm validates against the trusted-publisher config on
  # npmjs.com (axistaylor/nextpress → AxisTaylor/nextpress → release.yml).
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Expose the wp-tag step's outputs so the downstream
    # deploy_plugin_dist job can pick them up. wp_plugin_version is the
    # gate — when empty, the WP tag step didn't run (no publish
    # happened), so dist mirroring is skipped.
    outputs:
      wp_plugin_tag_name: ${{ steps.wp-tag.outputs.tag_name }}
      wp_plugin_version: ${{ steps.wp-tag.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      # Guarantee npm >= 11.5.1 (when trusted publishing landed). Node 24
      # ships an 11.x npm, but pinning the upgrade removes "works locally
      # but breaks on CI when the bundled npm shifts" surprises.
      - name: Pin npm to a trusted-publishing-capable version
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build packages
        run: npm run build

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run changeset:version
          publish: npm run changeset:publish
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NODE_AUTH_TOKEN / NPM_TOKEN — npm publish authenticates via
          # OIDC against the npmjs.com trusted-publisher config. Leaving an
          # auth token here would short-circuit OIDC and fall back to token
          # auth (which is what was failing).

      - name: Create WordPress plugin tag
        id: wp-tag
        if: steps.changesets.outputs.published == 'true' || steps.changesets.outputs.hasChangesets == 'false'
        run: |
          # Extract version from WordPress package.json (managed by changesets)
          VERSION=$(node -p "require('./packages/wordpress/package.json').version")
          TAG_NAME="wp-v${VERSION}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

          # Check if tag already exists (fetch remote tags since CI may be a shallow clone)
          git fetch --tags origin 2>/dev/null || true
          if git tag -l "$TAG_NAME" | grep -q "^${TAG_NAME}$"; then
            echo "Tag $TAG_NAME already exists, skipping"
          else
            echo "Creating tag $TAG_NAME"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG_NAME"
            git push origin "$TAG_NAME"
          fi

      - name: Setup PHP
        if: steps.wp-tag.outputs.version
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: mbstring, intl
          tools: composer

      - name: Install WordPress plugin dependencies
        if: steps.wp-tag.outputs.version
        working-directory: packages/wordpress
        run: composer install --no-dev --optimize-autoloader

      - name: Create WordPress plugin zip
        if: steps.wp-tag.outputs.version
        working-directory: packages/wordpress
        run: |
          mkdir -p plugin-build
          composer archive -vvv --format=zip --file="plugin-build/nextpress"

      - name: Upload WordPress plugin artifact
        if: steps.wp-tag.outputs.version
        uses: actions/upload-artifact@v4
        with:
          name: nextpress-${{ steps.wp-tag.outputs.version }}
          path: packages/wordpress/plugin-build/nextpress.zip

      - name: Create WordPress GitHub Release
        if: steps.wp-tag.outputs.version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.wp-tag.outputs.tag_name }}
          files: packages/wordpress/plugin-build/nextpress.zip
          generate_release_notes: true
          name: WordPress Plugin v${{ steps.wp-tag.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Mirror the tagged plugin into AxisTaylor/nextpress-wp-plugin-dist so
  # Packagist can serve `axistaylor/nextpress` from a stable URL with
  # tagged releases. Runs only when the release job produced a WP plugin
  # tag — i.e. a publish actually happened.
  #
  # This used to live in a standalone deploy-wp-plugin-dist.yml triggered
  # by `push: tags`, but the wp-v tag is pushed by the release job using
  # GITHUB_TOKEN, and tag pushes by GITHUB_TOKEN do NOT trigger other
  # workflows (GitHub's recursive-run guard). Pulling the deploy into
  # this workflow as a second job sidesteps that entirely.
  deploy_plugin_dist:
    name: Deploy plugin to distribution repo
    needs: release
    if: needs.release.outputs.wp_plugin_version != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source at the new tag
        uses: actions/checkout@v4
        with:
          # Pin to the tag the release job just created — the workflow's
          # triggering SHA predates the changesets-driven version-bump
          # commit, so a default checkout would miss the bumped versions.
          ref: ${{ needs.release.outputs.wp_plugin_tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      # Install at the repo root so the WP plugin's webpack bundle build
      # can resolve devDependencies via the monorepo's hoisted node_modules.
      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      # Build the editor/runtime bundles webpack writes into assets/dist/.
      # Without this the dist repo would ship sources only and the plugin
      # would break on install.
      - name: Build WordPress plugin bundles
        working-directory: packages/wordpress
        run: npm run build

      - name: Install runtime composer dependencies
        working-directory: packages/wordpress
        run: composer install --no-dev --optimize-autoloader

      - name: Setup environment
        run: |
          set -eux
          PLUGIN_DIR="$GITHUB_WORKSPACE/packages/wordpress"
          SRC_DIR="$GITHUB_WORKSPACE/source"
          DIST_DIR="$GITHUB_WORKSPACE/dist"
          # The source-repo tag is `wp-vX.Y.Z`; the dist repo uses the
          # bare `vX.Y.Z` form so Packagist parses the version cleanly.
          SOURCE_TAG="${{ needs.release.outputs.wp_plugin_tag_name }}"
          DIST_TAG="${SOURCE_TAG#wp-}"

          echo "PLUGIN_DIR=$PLUGIN_DIR" >> $GITHUB_ENV
          echo "SRC_DIR=$SRC_DIR" >> $GITHUB_ENV
          echo "DIST_DIR=$DIST_DIR" >> $GITHUB_ENV
          echo "SOURCE_TAG=$SOURCE_TAG" >> $GITHUB_ENV
          echo "DIST_TAG=$DIST_TAG" >> $GITHUB_ENV

      - name: Sync plugin files locally
        run: |
          set -eux
          rm -rf "$SRC_DIR" "$DIST_DIR"
          mkdir -p "$SRC_DIR"
          rsync -av --exclude-from="$PLUGIN_DIR/.distignore" "$PLUGIN_DIR/" "$SRC_DIR/"

      - name: Setup SSH deploy key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.WP_PLUGIN_DIST_DEPLOY_KEY }}
          known_hosts: github.com

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy to distribution repo
        run: |
          set -eux

          # Plain clone: the dist repo lands at $DIST_DIR with its
          # metadata at $DIST_DIR/.git in the normal layout. The earlier
          # GIT_DIR/GIT_WORK_TREE-split pattern (cloning into
          # $DIST_DIR/.git directly) put metadata at $DIST_DIR/.git/.git
          # so subsequent git commands looking at GIT_DIR=$DIST_DIR/.git
          # errored with "fatal: not a git repository".
          git clone --progress --verbose git@github.com:AxisTaylor/nextpress-wp-plugin-dist.git "$DIST_DIR"
          cd "$DIST_DIR"

          # Make sure main exists locally — branch is unborn on a freshly
          # bootstrapped dist repo until the first push.
          git checkout -B main

          # Sync the staged source bundle into the dist working tree,
          # deleting anything the bundle no longer includes (so removed
          # files actually disappear from the dist repo). --exclude=.git
          # protects the cloned metadata directory.
          rsync -av --delete --exclude='.git' "$SRC_DIR/" ./

          git add --all
          git commit --allow-empty --message "Release $DIST_TAG"

          git tag --force "$DIST_TAG"
          git push --force --tags origin main
